# ============================================================
# Reporting Pipeline Parameters
# ============================================================

# ---- Input directories. The first-order subdir(s) will be considered 'patient(s)'. The presence of VCFs AND/OR CNVkit outputs within these subdirs will decide the behavior of this pipeline. Filenames matter too (there is a syntax to it!) ---------------
# NOTE: this run of preprocessing also emits per-sample facets_purity/ (FACETS
# tumour-purity estimate) and a purity+ploidy-adjusted *purity.ploidy.call.cns -
# both picked up automatically for the report's "Tumour Purity" section and CNV calls.
input_dir: "/fs04/scratch2/vh83/liem/projects/preprocessing_pipeline/results_cnvkit_purity_ploidy_sex_261509"

# ----- MARKERS AND WHITELIST FOR THE PROJECT ------------------------------
hotspot_markers: "/fs04/scratch2/vh83/liem/resources/markers/marker.csv"

# ----- Whitelists ----------------------------
# Exact-position WHO CNS5 hotspots (CHROM,POS,REF,ALT,GENE,TRANSCRIPT,CDNA,
# PROTEIN_OR_NAME,CONTEXT) - consumed by the WHITELIST module (BAM ->
# per-hotspot tumour/normal REF/ALT read counts for the report's
# supplementary section), not by VCF_PRIORITISE.
#
# OPTIONAL: leave blank (or comment out) to skip the WHITELIST step entirely.
# The report then carries a note in the "WHO CNS5 Hotspot Read Counts" section
# saying no whitelist was included, instead of the read-count table.
whitelist: "/fs04/scratch2/vh83/liem/areas/whitelist/whitelist.csv"

# ----- Supplementary: tool/annotation-database versions ----------------------
# Manually-maintained, shared across the whole cohort - these can't be
# recovered reliably from filenames or container tags alone (see
# supplementary.json itself and generate_report.py's load_supplementary()).
# OPTIONAL: leave blank to render both Supplementary tables as "not provided".
supplementary_json: "/fs04/scratch2/vh83/liem/projects/reporting_pipeline/supplementary.json"



# ----------------------- VCF: High-confidence variant filtering ---------------------------
repetitive_regions_bed: "/fs04/vh83/reference/annotation_databases/variant_annotation/repetitive_regions/repeat_union.bed"
repetitive_regions_rescue: 0.2
min_universal_tumour_af: 0.1
min_universal_normal_af: 0.25

min_germline_tumour_depth: 50
min_germline_normal_depth: 50

min_strongsomatic_tumour_depth: 45
min_strongsomatic_normal_depth: 50

min_likelysomatic_tumour_depth: 60
min_likelysomatic_normal_depth: 50

min_strongloh_tumour_depth: 40
min_strongloh_normal_depth: 50

min_likelyloh005_tumour_depth: 65
min_likelyloh005_normal_depth: 50

min_likelyloh095_tumour_depth: 25
min_likelyloh095_normal_depth: 50


# ---- VCF: Annotations----

## --------------------------------- MANE ------------------------
mane_db_dir: "/fs04/vh83/pipeline_reference/annotations/snpeff_cache/h38/MANE/1.2"

# -------------------------------- ClinVar -----------------------
clinvar_vcf: "/fs04/vh83/pipeline_reference/annotations/clinvar/20260615/clinvar_20260615.vcf.gz"

# --------------------------- VEP ---------------------------
vep_cache_dir: "/fs04/vh83/pipeline_reference/annotations/vep_cache/115/RefSeq"
vep_fasta: "/fs04/vh83/pipeline_reference/genomes/hg38/Homo_sapiens_assembly38.fasta"
vep_species: "homo_sapiens"
vep_assembly: "GRCh38"

# ----- gnomAD -----------------------
gnomad_vcf: "/fs04/vh83/reference/annotation_databases/variant_annotation/gnomad/af-only-gnomad.hg38.vcf.gz"
gnomad_info_prefix: "GNOMAD_"

# ----- spliceAI  ----------------------1-
# UCSC "chr"-prefixed + tabix-indexed copy of the SpliceAI resource. The raw
# (Ensembl-contig) source silently matches 0 records against "chr"-prefixed sample
# VCFs - this pre-renamed copy is the one to actually annotate against.
spliceai_vcf: "/fs04/vh83/reference/annotation_databases/variant_annotation/spliceai/spliceai_scores.masked.snv.hg38.chr.vcf.gz"

# ----- dbNSFP -----------------------
dbnsfp_db: "/fs04/vh83/reference/annotation_databases/variant_annotation/dbnsfp/dbNSFP5.3.1a_grch38.gz"
dbnsfp_fields: "REVEL_score,AlphaMissense_score,AlphaMissense_pred,BayesDel_addAF_score,BayesDel_noAF_score,gnomAD4.1_joint_AF,gnomAD4.1_joint_POPMAX_AF,gnomAD4.1_joint_nhomalt,gnomAD4.1_joint_AFR_AC,gnomAD4.1_joint_AFR_AN,gnomAD4.1_joint_AMI_AC,gnomAD4.1_joint_AMI_AN,gnomAD4.1_joint_AMR_AC,gnomAD4.1_joint_AMR_AN,gnomAD4.1_joint_ASJ_AC,gnomAD4.1_joint_ASJ_AN,gnomAD4.1_joint_EAS_AC,gnomAD4.1_joint_EAS_AN,gnomAD4.1_joint_FIN_AC,gnomAD4.1_joint_FIN_AN,gnomAD4.1_joint_MID_AC,gnomAD4.1_joint_MID_AN,gnomAD4.1_joint_NFE_AC,gnomAD4.1_joint_NFE_AN,gnomAD4.1_joint_SAS_AC,gnomAD4.1_joint_SAS_AN"
# CGenReporter install, for its somatic gate (scripts/somatic_gate.sh) (CGen, 2026-10-09)
cgen_reporter_dir: "/fs04/vh83/local_software/cgen_tools/CGenReporter"

# ---- CGEN_REPORT (CGenGx final report, 2026-10-14) ----
# metadata schema here is cohort_run.py's own (tumour_sample/normal_sample/patient_id/
# oncotree_code/...) - NOT the same file as patient_metadata above (that one's for
# GENERATE_REPORT's display table only, missing the columns cohort_run.py needs).
cgen_metadata: "/fs04/scratch2/vh83/liem/projects/reporting_pipeline/metadata_20261009.tsv"
cgen_run_config: "/fs04/vh83/local_software/cgen_tools/CGenReporter/config/run_config_m3.json"
# No default - an OncoKB academic-licence bearer token. Must be supplied per run
# (--oncokb_api_token on the command line), never committed here.
oncokb_api_token: null

# ----- Online Databases -----------------------
oncokb_gene_list: "/fs04/vh83/reference/annotation_databases/variant_annotation/oncokb/cancerGeneList.tsv"
cosmic_cmc: "/fs04/vh83/reference/annotation_databases/variant_annotation/cosmic/CancerMutationCensus_AllData_v104_GRCh37.tsv.gz"
cancerhotspots_v1: "/fs04/vh83/reference/annotation_databases/variant_annotation/cancerhotspots/hotspots.xls"
cancerhotspots_v2: "/fs04/vh83/reference/annotation_databases/variant_annotation/cancerhotspots/hotspots_v2.xls"
cancerhotspots_v3: "/fs04/vh83/reference/annotation_databases/variant_annotation/cancerhotspots/hotspots_v3.xlsx"
eviq_germline: "/fs04/vh83/reference/annotation_databases/variant_annotation/eviq/germline_eviq.csv"

# ------- Patient metadata -----------------------
patient_metadata: "/fs04/scratch2/vh83/liem/resources/CGEN/MOLBI_SQL.tsv"

# ---- CNV ----
# Chromosome/arm calls are length-based (% of segment length AMP/DEL/CN-LOH),
# arm-first with promotion to chromosome-level when both arms agree (see
# bin/generate_report.py). The CNVkit `weight`-column weighted CN is shown
# alongside each call (rounded to the nearest integer) and drives the
# multigene/focal-event "interesting segment" comparison.
chrom_arm_bed: "/fs04/scratch2/vh83/liem/resources/chrom_arm.bed"
cn_pct_alt_threshold: 90.0  # chromosome/arm %% length AMP/DEL/CN-LOH required to call it
amp_segment_cn: 3           # CN at or above which a segment counts as amplified
del_segment_cn: 1           # CN at or below which a segment counts as deleted

# Absolute-CN scatter plots (bin/cnv_absolute_scatter.py, via
# CREATE_CNVKIT_SCATTER): fixed y-axis ceiling (0 to this value) - never
# expanded. A segment whose CN exceeds it is drawn clipped at the ceiling,
# marked with a triangle, and labelled with its true CN above the plot.
scatter_y_max: 10



# ---- PyTMB ----
pytmb_db_config: "/fs04/vh83/pipeline_reference/annotations/pytmb_settings/snpeff.yml"
pytmb_var_config: "/fs04/vh83/pipeline_reference/annotations/pytmb_settings/vardict.yml"
pytmb_eff_size: 33280000
pytmb_vaf: 0.05
pytmb_min_depth: 20
pytmb_min_alt: 2
pytmb_filter_syn: true
pytmb_filter_nc: true
pytmb_filter_lq: true

# ---- Output path ----
outdir: "results_cgen_test_M24087"
